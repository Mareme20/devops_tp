name: Demo Docker Hub Push

on:
  push:
    branches: [ "main" ]
    tags: [ 'v*.*.*' ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push PHP image
        uses: docker/build-push-action@v5
        with:
          context: ./php
          push: true
          tags: |
            mareme2930/php-apache-crud:latest
            mareme2930/php-apache-crud:${{ github.ref_name }}

      - name: Test Docker Compose launch
        run: docker-compose up -d --build

      - name: Slack Notification
        uses: rtCamp/action-slack-notify@v2
        if: always()
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_TITLE: "Statut du Build Docker"
          SLACK_MESSAGE: "Le build de l'image est terminé ! Résultat : ${{ job.status }}"
          SLACK_COLOR: ${{ job.status }}
