filebeat.inputs:
  - type: container
    enabled: true
    paths:
      - /var/lib/docker/containers/*/*.log
    stream: all

processors:
  - add_docker_metadata:
      host: "unix:///var/run/docker.sock"
      match_source: true

output.logstash:
  hosts: ["logstash:5044"]

setup.ilm.enabled: false
