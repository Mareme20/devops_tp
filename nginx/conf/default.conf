server {
    listen 80;
    server_name localhost;
    # Redirection automatique du HTTP vers le HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name localhost;

    # Chemins vers les certificats SSL générés avec OpenSSL
    ssl_certificate /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;

    # Optimisations de sécurité SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        # IMPORTANT : Le nom de l'hôte doit correspondre au nom du service dans docker-compose.yml
        proxy_pass http://php-apache:80;
        
        # Transmission des en-têtes réels pour que PHP reçoive les bonnes infos client
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Interdire l'accès aux fichiers cachés (comme .htaccess ou .git)
    location ~ /\.ht {
        deny all;
    }
}
