services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - php-apache
    networks:
      - crud_network

  php-apache:
    build: ./php
    image: devops-tp-php-apache
    volumes:
      - ./src:/var/www/html
    environment:
      - APACHE_DOCUMENT_ROOT=/var/www/html/public
    networks:
      - crud_network

  postgres:
    image: postgres:13
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: crud_db
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d crud_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - crud_network

  pgadmin:
    image: dpage/pgadmin4
    ports:
      - "8083:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: root
    networks:
      - crud_network

  nexus:
    image: sonatype/nexus3
    profiles:
      - artifact-repo
    ports:
      - "8081:8081"
      - "8085:8085"
    environment:
      INSTALL4J_ADD_VM_PARAMS: >-
        -Xms512m -Xmx512m -XX:MaxDirectMemorySize=512m
        -Dnexus.security.randompassword=false
    volumes:
      - nexus_data:/nexus-data
    networks:
      - crud_network

  nexus-init:
    image: curlimages/curl:8.7.1
    profiles:
      - artifact-repo
    depends_on:
      - nexus
    volumes:
      - nexus_data:/nexus-data:ro
      - ./nexus/setup/init-nexus.sh:/setup/init-nexus.sh:ro
    entrypoint: ["/bin/sh", "/setup/init-nexus.sh"]
    networks:
      - crud_network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.0
    profiles:
      - observability
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      # RÉDUCTION MÉMOIRE ICI (256m)
      - "ES_JAVA_OPTS=-Xms256m -Xmx256m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - crud_network

  logstash:
    image: docker.elastic.co/logstash/logstash:7.17.0
    profiles:
      - observability
    depends_on:
      - elasticsearch
    ports:
      - "5044:5044"
    environment:
      # RÉDUCTION MÉMOIRE LOGSTASH AUSSI
      - "LS_JAVA_OPTS=-Xms256m -Xmx256m"
    volumes:
      - ./elk/logstash/pipeline/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    networks:
      - crud_network

  kibana:
    image: docker.elastic.co/kibana/kibana:7.17.0
    profiles:
      - observability
    depends_on:
      - elasticsearch
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      # LIMITE MÉMOIRE POUR KIBANA
      - NODE_OPTIONS=--max-old-space-size=512
    networks:
      - crud_network

  filebeat:
    image: docker.elastic.co/beats/filebeat:7.17.0
    profiles:
      - observability
    user: root
    command: ["--strict.perms=false"]
    depends_on:
      - logstash
    volumes:
      - ./elk/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - crud_network

networks:
  crud_network:
    driver: bridge

volumes:
  db_data:
  nexus_data:
  elasticsearch_data:
